[package]
name = "fox-services-top-adapters"
description = "fox-services-top read-only telemetry adapters (procfs, hwmon, thermal, powercap, NVML, network, filesystem, replay) and the process action adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Test aids: the read-counting file system and catalog bookkeeping sizes.
test-support = []

[dependencies]
fox-services-top-core.workspace = true
libc.workspace = true
nix.workspace = true
nvml-wrapper.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

# Apple Silicon telemetry: sysinfo (processes, disks, networks, swap) and
# the IOKit/CoreFoundation bindings (Apple GPU properties). CPU times and
# host facts come from the already-depended-on libc (sysctlbyname, Mach).
[target.'cfg(target_os = "macos")'.dependencies]
sysinfo.workspace = true
io-kit-sys.workspace = true
core-foundation-sys.workspace = true

[dev-dependencies]
fox-services-top-core = { workspace = true, features = ["test-support"] }
# The crate's own integration tests use its test aids.
fox-services-top-adapters = { path = ".", features = ["test-support"] }

[lints]
workspace = true
