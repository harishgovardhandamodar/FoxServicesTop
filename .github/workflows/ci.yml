name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only reads the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Pinned toolchain (rust-toolchain.toml); CI never floats on `stable`.
  RUST_TOOLCHAIN: "1.92.0"

jobs:
  quality:
    name: fmt / check / clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  boundaries:
    name: dependency boundaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo metadata --format-version 1 --locked > metadata.json
      - run: python3 scripts/check_boundaries.py metadata.json
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/check_validation.py

  test:
    name: test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Unit, contract, replay, PTY, disposable-child action and fault-injection
      # suites. Hardware suites are #[ignore] and run only on target hardware;
      # shared runners never certify GPU support or performance.
      - run: cargo test --workspace --all-features --locked

  build:
    name: release build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on Ubuntu 22.04 like the release, so the binaries need glibc
          # 2.34 at most and run on Ubuntu 22.04, Debian 12, RHEL 9 and newer.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            os: linux
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            os: linux
          # Apple Silicon diagnostics (no glibc floor; macos-14 is arm64).
          - target: aarch64-apple-darwin
            runner: macos-14
            os: macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify version metadata and SQLite gate
        run: ./target/${{ matrix.target }}/release/fox-services-top --version --verbose
      - name: The Apple Silicon diagnostics answer on macOS
        if: matrix.os == 'macos'
        run: ./target/${{ matrix.target }}/release/fox-services-top --diagnostics-json
      - name: The Linux binary needs glibc 2.34 at most
        if: matrix.os == 'linux'
        run: |
          required="$(objdump -p "target/${{ matrix.target }}/release/fox-services-top" | grep -o 'GLIBC_[0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -n 1)"
          echo "highest glibc version required: ${required}"
          test "$(printf '%s\n' "${required}" 2.34 | sort -V | tail -n 1)" = 2.34
      - name: The release archive installs with install.sh
        run: |
          version="$(cargo metadata --format-version 1 --locked --no-deps | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="fox-services-top"))')"
          name="fox-services-top-v${version}-${{ matrix.target }}"
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/${name}.tar.gz" fox-services-top
          # `sha256sum` on Linux, `shasum -a 256` on stock macOS.
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${name}.tar.gz" > SHA256SUMS)
          else
            (cd dist && shasum -a 256 "${name}.tar.gz" > SHA256SUMS)
          fi
          ./install.sh --version "v${version}" --base-url "file://${PWD}/dist" --install-dir "${RUNNER_TEMP}/bin"
