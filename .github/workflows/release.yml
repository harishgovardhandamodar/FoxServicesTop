name: Release

# Runs only when a maintainer pushes a version tag. The release is published
# once the gate passes and all three builds pass their version and install
# checks (plus the glibc check on Linux and the diagnostics check on macOS);
# the published release is then installed on the supported Linux systems and
# on Apple Silicon (D-63).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.92.0"

jobs:
  gate:
    name: release gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Tag must equal the workspace package version
        run: |
          version="$(cargo metadata --format-version 1 --locked --no-deps | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="fox-services-top"))')"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package version v${version}"; exit 1; }
      # The release page shows docs/releases/<tag>.md, written in the release PR.
      - name: The tag has its release notes
        run: test -s "docs/releases/${GITHUB_REF_NAME}.md" || { echo "missing docs/releases/${GITHUB_REF_NAME}.md"; exit 1; }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo metadata --format-version 1 --locked > metadata.json
      - run: python3 scripts/check_boundaries.py metadata.json
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/check_validation.py
      # Declared licenses of the locked dependencies, for the SBOM.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-metadata
          path: metadata.json

  build:
    name: build ${{ matrix.target }}
    needs: gate
    strategy:
      fail-fast: true
      matrix:
        include:
          # GNU targets only: musl builds are not produced because NVML is untested
          # there, and the installer never falls back from GNU to musl. Ubuntu
          # 22.04 images keep the required glibc at 2.34 at most. The macOS
          # build carries the Apple Silicon diagnostics instead.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            os: linux
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            os: linux
          # Apple Silicon diagnostics ride the same tag as a parallel
          # release (macos-14 is arm64).
          - target: aarch64-apple-darwin
            runner: macos-14
            os: macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify the artifact reports the tag, target and SQLite runtime
        run: |
          bin="target/${{ matrix.target }}/release/fox-services-top"
          "$bin" --version --verbose | tee version.txt
          grep -qxF "fox-services-top ${GITHUB_REF_NAME#v}" version.txt
          grep -qxF "target: ${{ matrix.target }}" version.txt
          grep -qE '^sqlite: [0-9]+(\.[0-9]+)+ \(runtime gate >= 3\.51\.3: ok\)$' version.txt
      - name: The Apple Silicon diagnostics answer on macOS
        if: matrix.os == 'macos'
        run: |
          bin="target/${{ matrix.target }}/release/fox-services-top"
          "$bin" --diagnostics-json > diagnostics.json
          python3 - <<'EOF'
          import json
          report = json.load(open("diagnostics.json"))
          assert [a["adapter_id"] for a in report["adapters"]] == ["macos"], report["adapters"]
          assert report["target"] == "aarch64-apple-darwin", report
          print("macOS diagnostics: healthy macos adapter, target ok")
          EOF
      - name: The Linux binary needs glibc 2.34 at most
        if: matrix.os == 'linux'
        run: |
          required="$(objdump -p "target/${{ matrix.target }}/release/fox-services-top" | grep -o 'GLIBC_[0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -n 1)"
          echo "highest glibc version required: ${required}"
          test "$(printf '%s\n' "${required}" 2.34 | sort -V | tail -n 1)" = 2.34
      - name: Package
        run: |
          name="fox-services-top-${GITHUB_REF_NAME}-${{ matrix.target }}"
          tar -C "target/${{ matrix.target }}/release" -czf "${name}.tar.gz" fox-services-top
          # `sha256sum` on Linux, `shasum -a 256` on stock macOS.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
      - name: The archive installs with install.sh
        run: |
          mkdir -p smoke
          cp "fox-services-top-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" smoke/
          # `sha256sum` on Linux, `shasum -a 256` on stock macOS.
          if command -v sha256sum >/dev/null 2>&1; then
            (cd smoke && sha256sum fox-services-top-*.tar.gz > SHA256SUMS)
          else
            (cd smoke && shasum -a 256 fox-services-top-*.tar.gz > SHA256SUMS)
          fi
          ./install.sh --version "${GITHUB_REF_NAME}" --base-url "file://${PWD}/smoke" --install-dir "${RUNNER_TEMP}/bin"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: |
            fox-services-top-*.tar.gz
            fox-services-top-*.tar.gz.sha256

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and SBOM
        run: |
          cd dist
          sha256sum fox-services-top-*.tar.gz > SHA256SUMS
          python3 ../scripts/sbom.py ../Cargo.lock "${GITHUB_REF_NAME}" metadata.json > "fox-services-top-${GITHUB_REF_NAME}.cdx.json"
          cat SHA256SUMS
      # No `draft`: the action uploads the assets first and then publishes.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          make_latest: true
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            dist/fox-services-top-*.tar.gz
            dist/SHA256SUMS
            dist/fox-services-top-*.cdx.json

  # A release published with GITHUB_TOKEN starts no other workflow, so the
  # install test of the published release is called from here.
  install:
    name: install the published release
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/install.yml
    with:
      version: ${{ github.ref_name }}
